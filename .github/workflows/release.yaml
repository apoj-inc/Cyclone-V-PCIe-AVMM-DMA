name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
    contents: write

env:
  ALTERA_TOOLS_ARGS: "--mount type=bind,src=$PWD,dst=/mnt/work --mac-address=${{ secrets.LM_LICENSE_MAC }} --workdir=/mnt/work --network=bridge"

jobs:
    build_altera_tools_and_push:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4

        - name: log in to docker hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.docker_username }}
            password: ${{ secrets.dockerhub_token }}
        
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Extract SHA
          id: meta
          run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        
        - name: Build and push amd64-arch production image
          uses: docker/build-push-action@v6
          with:
            context: ".docker/altera_tools"
            platforms: linux/amd64
            target: production
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/altera_tools:latest
              ${{ secrets.DOCKER_USERNAME }}/altera_tools:${{ steps.meta.outputs.SHORT_SHA }}
            cache-from: type=gha
            cache-to: type=gha,mode=max
            push: true
            outputs: type=docker,dest=${{ runner.temp }}/altera_tools.tar

        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: altera_tools
            path: ${{ runner.temp }}/altera_tools.tar

    compile_release:
        runs-on: ubuntu-latest
        needs: build_altera_tools_and_push
        steps:
        - uses: actions/checkout@v4

        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: altera_tools
            path: ${{ runner.temp }}

        - name: Load image
          run: |
            docker load --input ${{ runner.temp }}/altera_tools.tar
            sudo rm -rf ${{ runner.temp }}/altera_tools.tar
        
        - name: Run build release
          shell: bash
          run: docker run ${{env.ALTERA_TOOLS_ARGS}} ${{ secrets.DOCKER_USERNAME }}/altera_tools:latest "make make_release"
          timeout-minutes: 60

        - name: Prepare releases for artifacts
          shell: bash
          run: |
            mkdir -p ${{ runner.temp }}/release
            find release -name "*qar" | xargs -I {} -t mv {} ${{ runner.temp }}/release
            cd ${{ runner.temp }}
            tar -czf release.tar.gz release

        - name: Upload releases artifact
          uses: actions/upload-artifact@v4
          with:
            name: release
            path: ${{ runner.temp }}/release.tar.gz

    release:
        needs: [compile_release]
        runs-on: ubuntu-latest
        steps:
        - name: Download topologies
          uses: actions/download-artifact@v4
          with:
            name: release
            path: ${{ runner.temp }}

        - name: Unpack artifacts for releases
          shell: bash
          run: tar -xzf ${{ runner.temp }}/release.tar.gz -C ${{ runner.temp }}

        - name: Create Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.event.inputs.version }}
            name: "HDLNoCGen ${{ github.event.inputs.version }}"
            body: |
                ## HDLNoCGeN ${{ github.event.inputs.version }}
            files: |
                ${{ runner.temp }}/release/*
            draft: false
            prerelease: false
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
