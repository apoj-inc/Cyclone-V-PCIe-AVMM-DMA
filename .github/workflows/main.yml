name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  ALTERA_TOOLS_ARGS: "--mount type=bind,src=$PWD,dst=/mnt/work --mac-address=${{ secrets.LM_LICENSE_MAC }} --workdir=/mnt/work --network=bridge"

jobs:
  pull_and_test_docker_test_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Pull from docker hub
        run: docker pull ${{ secrets.docker_username }}/altera_tools:latest

      - name: Run docker image tests
        shell: bash
        run: |
          chmod +x build_system/autotest/configure
          docker run ${{env.ALTERA_TOOLS_ARGS}} ${{ secrets.docker_username }}/altera_tools:latest "./build_system/autotest/configure --prefix=QUESTA; \
          make -f build_system/cctb/makefile run; \
          make -f build_system/autotest/makefile run_pytest TESTS_DIRS=tb/tb_dma_csr"
        timeout-minutes: 15

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Export image to tar
        run: docker save -o ${{ runner.temp }}/altera_tools-dev.tar ${{ secrets.docker_username }}/altera_tools:latest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: altera_tools-dev
          path: ${{ runner.temp }}/altera_tools-dev.tar

  run_rtl_tests:
    runs-on: ubuntu-latest
    needs: pull_and_test_docker_test_image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: altera_tools-dev
          path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input ${{ runner.temp }}/altera_tools-dev.tar
          sudo rm -rf ${{ runner.temp }}/altera_tools-dev.tar

      - name: Run full pytest
        shell: bash
        run: docker run ${{env.ALTERA_TOOLS_ARGS}} ${{ secrets.docker_username }}/altera_tools:latest "make -f build_system/autotest/makefile run_pytest"
        timeout-minutes: 120

  check_releases:
    runs-on: ubuntu-latest
    needs: pull_and_test_docker_test_image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: altera_tools-dev
          path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input ${{ runner.temp }}/altera_tools-dev.tar
          sudo rm -rf ${{ runner.temp }}/altera_tools-dev.tar

      - name: Run build release
        shell: bash
        run: docker run ${{env.ALTERA_TOOLS_ARGS}} ${{ secrets.DOCKER_USERNAME }}/altera_tools:latest "make -f build_system/quartus/makefile create_releases"
        timeout-minutes: 60
